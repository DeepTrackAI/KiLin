<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="250" viewBox="0 0 1200 250"
     role="img" aria-labelledby="title desc">
  <title id="title">Project type and intent routing</title>
  <desc id="desc">
    Project type defines intents. Routing selects and validates an intent,
    whose configuration determines history, retrieval, tool use, and answering.
  </desc>

  <rect width="1200" height="250" fill="#ffffff"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10"
            refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #475569; stroke-width: 2; }
      .title {
        font: 600 19px Arial, Helvetica, sans-serif;
        fill: #0f172a;
        text-anchor: middle;
      }
      .body {
        font: 15px Arial, Helvetica, sans-serif;
        fill: #334155;
        text-anchor: middle;
      }
      .arrow {
        stroke: #475569;
        stroke-width: 3;
        fill: none;
        marker-end: url(#arrow);
      }
    </style>
  </defs>

  <rect x="20" y="45" width="200" height="150" rx="14" class="box"/>
  <text x="120" y="88" class="title">Project type</text>
  <text x="120" y="121" class="body">
    <tspan x="120" dy="0">Defines project-wide</tspan>
    <tspan x="120" dy="22">behavior</tspan>
  </text>

  <line x1="225" y1="120" x2="255" y2="120" class="arrow"/>

  <rect x="260" y="45" width="200" height="150" rx="14" class="box"/>
  <text x="360" y="88" class="title">Intents</text>
  <text x="360" y="121" class="body">
    <tspan x="360" dy="0">Define the supported</tspan>
    <tspan x="360" dy="22">request types</tspan>
  </text>

  <line x1="465" y1="120" x2="495" y2="120" class="arrow"/>

  <rect x="500" y="45" width="200" height="150" rx="14" class="box"/>
  <text x="600" y="88" class="title">Routing</text>
  <text x="600" y="116" class="body">
    <tspan x="600" dy="0">Checks shortcuts first,</tspan>
    <tspan x="600" dy="22">otherwise uses the</tspan>
    <tspan x="600" dy="22">router model</tspan>
  </text>

  <line x1="705" y1="120" x2="735" y2="120" class="arrow"/>

  <rect x="740" y="45" width="200" height="150" rx="14" class="box"/>
  <text x="840" y="88" class="title">Selected intent</text>
  <text x="840" y="121" class="body">
    <tspan x="840" dy="0">Validated routing</tspan>
    <tspan x="840" dy="22">decision</tspan>
  </text>

  <line x1="945" y1="120" x2="975" y2="120" class="arrow"/>

  <rect x="980" y="45" width="200" height="150" rx="14" class="box"/>
  <text x="1080" y="88" class="title">Configured behavior</text>
  <text x="1080" y="116" class="body">
    <tspan x="1080" dy="0">History • Retrieval</tspan>
    <tspan x="1080" dy="22">Tool • Answering</tspan>
  </text>
</svg>
