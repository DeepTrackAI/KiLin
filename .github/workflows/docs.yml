name: Documentation integrity

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Links, SVGs and module map
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository documentation
        run: >-
          python -m unittest
          tests.setup.test__documentation_assets -v
