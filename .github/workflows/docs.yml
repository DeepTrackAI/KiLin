name: Documentation integrity

on:
  push:
    branches: [main, develop]
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push replaces a pull request's run; every push to main keeps
  # its own complete result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: Links, SVGs and module map
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check generated PyPI README is current
        run: python -m setup.generate_pypi_readme --check
      - name: Test README conversion and release links
        run: python -m unittest tests.setup.test__pypi_readme -v
      - name: Validate repository documentation
        run: >-
          python -m unittest
          tests.setup.test__documentation_assets -v
