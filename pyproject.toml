[project]
name = "qachat"
version = "0.1.0"
description = "Local, provider-independent question-answering application"
requires-python = ">=3.12,<3.13"
# Packages required regardless of the selected LLM backend.
dependencies = [
    "huggingface-hub==1.29.0",
    "numpy==2.5.2",
    "pdfminer-six==20260107",
    "pypdf==6.16.2",
]

# Install one computation backend for model work; GUI adds only Qt.
[project.optional-dependencies]
mlx = [
    "mlx-embeddings==0.0.5; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm==0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
torch = [
    "torch==2.14.0",
    "transformers==5.16.1",
]
gui = [
    "PySide6>=6.8,<7",
]
# Extra dependencies for the CodeRAG-Bench evaluation notebooks only.
bench = [
    "datasets==5.0.1",
    "pytrec_eval==0.5",
]


[project.scripts]
qachat = "qachat.cli:main"

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qachat*"]

[tool.setuptools.package-data]
# Data-only folders: project types and report templates.
"qachat" = [
    "qachat_defaults.json",
    "project_types/*.json",
]
"qachat.tools.generate_paper_summary" = [
    "README.md",
    "defaults.json",
    "templates/*.md",
]
"qachat.gui" = [
    "defaults.json",
    "web/*.html",
    "web/*.css",
    "web/*.js",
    "icons/*.png",
]

# Development tools are installed by `uv sync` but are not runtime dependencies.
[dependency-groups]
dev = [
    "black==26.5.1",
    "ipykernel==7.3.0",
    "jupyterlab==4.6.3",
    "ruff==0.16.6",
]

[tool.black]
line-length = 79
target-version = ["py312"]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]
