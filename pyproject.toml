[project]
name = "kilin"
version = "0.1.0"
authors = [
    {name = "Io̍k-uí Tiunn"},
    {name = "Joana B. Pereira"},
    {name = "Carlo Manzo"},
    {name = "Giovanni Volpe"},
]
description = "Local, provider-independent question-answering application"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Packages required regardless of the selected LLM backend.
dependencies = [
    "huggingface-hub==1.29.0",
    "numpy==2.5.2",
    "pdfminer-six==20260107",
    "pypdf==6.16.2",
]

# Install one computation backend for model work; GUI adds only Qt.
[project.optional-dependencies]
mlx = [
    "mlx-embeddings==0.0.5; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm==0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
torch = [
    "torch==2.14.0",
    "transformers==5.16.1",
]
gui = [
    "PySide6>=6.8,<7",
]
# Extra dependencies for the CodeRAG-Bench evaluation notebooks only.
bench = [
    "datasets==5.0.1",
    "pytrec_eval==0.5",
]


[project.scripts]
kilin = "kilin.cli:main"

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kilin*"]

[tool.setuptools.package-data]
# Data-only folders: project types and report templates.
"kilin" = [
    "kilin_defaults.json",
    "repository_reason_codes.json",
    "project_types/*.json",
]
"kilin.tools.project_inventory" = ["README.md", "defaults.json"]
"kilin.tools.scan_and_list" = ["README.md", "defaults.json"]
"kilin.tools.batch_classify" = ["README.md", "defaults.json"]
"kilin.tools.batch_review" = ["README.md", "defaults.json"]
"kilin.tools.filter_results" = ["README.md", "defaults.json"]
"kilin.tools.find_fact" = ["README.md", "defaults.json"]
"kilin.tools.find_passages" = ["README.md", "defaults.json"]
"kilin.tools.paper_overview" = ["README.md", "defaults.json"]
"kilin.tools.reference_check" = ["README.md", "defaults.json"]
"kilin.tools.show_source" = ["README.md", "defaults.json"]
"kilin.tools.suggest_reference" = ["README.md", "defaults.json"]
"kilin.tools.generate_paper_summary" = [
    "README.md",
    "defaults.json",
    "templates/*.md",
]
"kilin.gui" = [
    "defaults.json",
    "web/*.html",
    "web/*.css",
    "web/*.js",
    "icons/*.png",
    "icons/README.md",
]

# Development tools are installed by `uv sync` but are not runtime dependencies.
[dependency-groups]
dev = [
    "black==26.5.1",
    "ipykernel==7.3.0",
    "jupyterlab==4.6.3",
    "ruff==0.16.6",
]

[tool.black]
line-length = 79
target-version = ["py312"]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]
