<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="825" viewBox="0 0 1280 825" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Registered tool execution contract</title>
<desc id="figure-description">A validated project type provides an intent with a tool identifier. KíLín resolves it through the built-in registry, passes a ToolRequest and bounded ToolContext, and receives a ToolResult. Output and evidence join the normal turn checkpoint.</desc>

<defs>
  <marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#64748B" stroke-width="1.4" stroke-linecap="round"/></marker>
  <marker id="arrow-indigo" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#4F46E5" stroke-width="1.4" stroke-linecap="round"/></marker>
  <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#059669" stroke-width="1.4" stroke-linecap="round"/></marker>
  <marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#D97706" stroke-width="1.4" stroke-linecap="round"/></marker>
  <marker id="arrow-rose" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#E11D48" stroke-width="1.4" stroke-linecap="round"/></marker>
</defs>
<style>
  text { font-family: Inter, 'Avenir Next', 'Segoe UI', Arial, sans-serif; }
</style>

<rect x="0" y="0" width="1280" height="825" fill="#FFFFFF"/>
<rect x="0" y="0" width="1280" height="9" fill="#4F46E5"/>
<text x="45" y="43" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="750" fill="#0F172A">Registered tool execution contract</text>
<text x="46" y="74" font-family="Inter, Arial, sans-serif" font-size="16" fill="#64748B">Validated project intent selects one registered, built-in package</text>
<line x1="43" y1="91" x2="1237" y2="91" stroke="#E2E8F0" stroke-width="1.5"/>


<polyline points="301,220 351,220" fill="none" stroke="#4F46E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><polyline points="607,220 658,220" fill="none" stroke="#4F46E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><polyline points="959,220 1003,220" fill="none" stroke="#4F46E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><polyline points="1117,283 1117,352 562,352 562,428" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/><polyline points="738,497 795,497" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/><polyline points="187,428 187,359 803,359 803,297" fill="none" stroke="#D97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-amber)"/>
<rect id="intent" x="44" y="157" width="257" height="126" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="44" y="157" width="6" height="126" rx="3" fill="#D97706"/><text x="64" y="184" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="64" dy="0">ProjectType.Intent</tspan></text><text x="64" y="210" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="64" dy="0">Declarative project JSON</tspan><tspan x="64" dy="21">Validated tool identifier</tspan><tspan x="64" dy="21">Retrieval/history policy</tspan></text><rect id="tool-registry" x="352" y="157" width="255" height="126" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="352" y="157" width="6" height="126" rx="3" fill="#4F46E5"/><text x="372" y="184" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="372" dy="0">Built-in registry</tspan></text><text x="372" y="210" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="372" dy="0">tools/_registry.py</tspan><tspan x="372" dy="21">Resolve registered tool</tspan><tspan x="372" dy="21">No arbitrary plugin discovery</tspan></text><rect id="tool-context" x="659" y="141" width="300" height="156" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="659" y="141" width="6" height="156" rx="3" fill="#4F46E5"/><text x="679" y="168" fill="#0F172A" font-size="17" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="679" dy="0">ToolRequest + ToolContext</tspan></text><text x="679" y="194" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="679" dy="0">Request: question, intent, evidence</tspan><tspan x="679" dy="21">Context: models, files, callbacks</tspan><tspan x="679" dy="21">Validates settings and capabilities</tspan></text><rect id="tool-package" x="1004" y="157" width="230" height="126" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="1004" y="157" width="6" height="126" rx="3" fill="#4F46E5"/><text x="1024" y="184" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="1024" dy="0">Tool package</tspan></text><text x="1024" y="210" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="1024" dy="0">tool.py + defaults.json</tspan><tspan x="1024" dy="21">README + templates</tspan><tspan x="1024" dy="21">Private shared helpers</tspan></text><rect id="tool-result" x="386" y="429" width="352" height="137" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="386" y="429" width="6" height="137" rx="3" fill="#059669"/><text x="406" y="456" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="406" dy="0">ToolResult</tspan></text><text x="406" y="482" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="406" dy="0">Answer, evidence, summary metadata</tspan><tspan x="406" dy="21">streamed flag prevents double output</tspan><tspan x="406" dy="21">No implicit executable shell</tspan></text><rect id="tool-answer" x="796" y="429" width="345" height="137" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="796" y="429" width="6" height="137" rx="3" fill="#059669"/><text x="816" y="456" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="816" dy="0">RAGSession / answer turn</tspan></text><text x="816" y="482" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="816" dy="0">Deterministic citation-ID check</tspan><tspan x="816" dy="21">Conversation checkpoint</tspan><tspan x="816" dy="21">GUI receives saved result</tspan></text><rect id="tool-options" x="45" y="429" width="282" height="137" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="45" y="429" width="6" height="137" rx="3" fill="#D97706"/><text x="65" y="456" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="65" dy="0">Optional interactions</tspan></text><text x="65" y="482" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="65" dy="0">Plan: continue / quick / cancel</tspan><tspan x="65" dy="21">GUI supplies PDF callback</tspan><tspan x="65" dy="21">Headless: tool default</tspan></text><rect x="172" y="640" width="935" height="38" rx="9" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/><text x="186" y="657" fill="#334155" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="186" dy="0">Optional PDF rendering uses a GUI callback; the core tool can save Markdown without Qt</tspan></text>


<rect x="0" y="775" width="1280" height="50" fill="#F8FAFC"/>
<line x1="44" y1="775" x2="1236" y2="775" stroke="#E2E8F0"/>
<text x="45" y="805" font-size="13" fill="#475569" font-family="Inter,Arial,sans-serif">Tool packages are statically registered and own their defaults/resources · tool results remain part of one answer lifecycle</text>
<text x="1235" y="805" text-anchor="end" font-size="12" fill="#64748B" font-family="Inter,Arial,sans-serif">KíLín</text>

</svg>
