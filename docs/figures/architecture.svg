ill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="470" dy="0">Checkpoints, trace sink, advisory locks</tspan></text><rect id="packaged-resources" x="948" y="169" width="268" height="114" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="948" y="169" width="6" height="114" rx="3" fill="#D97706"/><text x="968" y="196" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="968" dy="0">Packaged resources</tspan></text><text x="968" y="222" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="968" dy="0">Defaults and project types</tspan><tspan x="968" dy="21">Read-only during normal use</tspan></text><rect id="models" x="948" y="332" width="268" height="121" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="948" y="332" width="6" height="121" rx="3" fill="#059669"/><text x="968" y="359" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="968" dy="0">Model cache / runtime</tspan></text><text x="968" y="385" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="968" dy="0">Local model snapshots</tspan><tspan x="968" dy="21">MLX or PyTorch (optional)</tspan></text><rect id="workspace" x="948" y="493" width="268" height="124" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="948" y="493" width="6" height="124" rx="3" fill="#059669"/><text x="968" y="520" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="968" dy="0">User workspace</tspan></text><text x="968" y="546" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="968" dy="0">Sources, indexes and outputs</tspan><tspan x="968" dy="21">Conversation JSON + .lock files</tspan></text>
