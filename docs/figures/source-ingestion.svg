<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Source ingestion and provenance</title>
<desc id="figure-description">Automatic directory scanning and explicit file selection have different policies. Both establish selected paths referring to original user files. Two separate workspace APIs can then manage source snapshots; format readers create units and the embedding tokenizer creates chunks.</desc>

<defs>
  <marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#64748B" stroke-width="1.4" stroke-linecap="round"/></marker>
  <marker id="arrow-indigo" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#4F46E5" stroke-width="1.4" stroke-linecap="round"/></marker>
  <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#059669" stroke-width="1.4" stroke-linecap="round"/></marker>
  <marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#D97706" stroke-width="1.4" stroke-linecap="round"/></marker>
  <marker id="arrow-rose" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#E11D48" stroke-width="1.4" stroke-linecap="round"/></marker>
</defs>
<style>
  text { font-family: Inter, 'Avenir Next', 'Segoe UI', Arial, sans-serif; }
</style>

<rect x="0" y="0" width="1280" height="850" fill="#FFFFFF"/>
<rect x="0" y="0" width="1280" height="9" fill="#4F46E5"/>
<text x="45" y="43" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="750" fill="#0F172A">Source ingestion and provenance</text>
<text x="46" y="74" font-family="Inter, Arial, sans-serif" font-size="16" fill="#64748B">Discovery, explicit import, extraction and chunking are separate stages</text>
<line x1="43" y1="91" x2="1237" y2="91" stroke="#E2E8F0" stroke-width="1.5"/>


<polyline points="229,252 229,276 510,276 510,296" fill="none" stroke="#4F46E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><polyline points="623,252 623,296" fill="none" stroke="#D97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/><polyline points="1035,252 1035,280 786,280 786,296" fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/><polyline points="559,372 559,406 424,406 424,436" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/><polyline points="733,372 733,406 856,406 856,436" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/><polyline points="425,565 425,601 194,601 194,655" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/><polyline points="856,565 856,625 194,625 194,655" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/><polyline points="345,714 372,714" fill="none" stroke="#4F46E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><polyline points="666,714 693,714" fill="none" stroke="#4F46E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><polyline points="984,714 1013,714" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<rect id="scan" x="55" y="126" width="345" height="126" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="55" y="126" width="6" height="126" rx="3" fill="#0284C7"/><text x="75" y="153" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="75" dy="0">Automatic directory scan</tspan></text><text x="75" y="179" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="75" dy="0">scan_repository() and reason codes</tspan><tspan x="75" dy="21">Exclusions and size / entry limits</tspan><tspan x="75" dy="21">Does not follow descendant links</tspan></text><rect id="explicit-import" x="451" y="126" width="345" height="126" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="451" y="126" width="6" height="126" rx="3" fill="#D97706"/><text x="471" y="153" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="471" dy="0">Explicit file selection</tspan></text><text x="471" y="179" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="471" dy="0">A separate selected-file policy</tspan><tspan x="471" dy="21">Some excluded-looking names allowed</tspan><tspan x="471" dy="21">User explicitly confirms the source</tspan></text><rect id="originals" x="845" y="126" width="380" height="126" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="845" y="126" width="6" height="126" rx="3" fill="#64748B"/><text x="865" y="153" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="865" dy="0">Original user files</tspan></text><text x="865" y="179" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="865" dy="0">Inputs remain user-owned</tspan><tspan x="865" dy="21">Import does not edit or remove originals</tspan><tspan x="865" dy="21">Scanner policy is not access control</tspan></text><rect id="selected-paths" x="412" y="297" width="465" height="75" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="412" y="297" width="6" height="75" rx="3" fill="#4F46E5"/><text x="432" y="324" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="432" dy="0">Selected source paths</tspan></text><text x="432" y="350" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="432" dy="0">Validated for the particular import workflow</tspan></text><rect id="cumulative" x="244" y="437" width="365" height="128" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="244" y="437" width="6" height="128" rx="3" fill="#059669"/><text x="264" y="464" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="264" dy="0">Cumulative managed import</tspan></text><text x="264" y="490" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="264" dy="0">workspace.prepare_sources_workspace()</tspan><tspan x="264" dy="21">sources/ plus sources.json</tspan><tspan x="264" dy="21">Managed copies accumulate over time</tspan></text><rect id="mirror" x="681" y="437" width="355" height="128" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="681" y="437" width="6" height="128" rx="3" fill="#059669"/><text x="701" y="464" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="701" dy="0">Single-origin mirror</tspan></text><text x="701" y="490" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="701" dy="0">project.prepare_project_workspace()</tspan><tspan x="701" dy="21">source_snapshot.json</tspan><tspan x="701" dy="21">Compare and synchronize one origin</tspan></text><rect id="read-files" x="45" y="656" width="300" height="116" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="45" y="656" width="6" height="116" rx="3" fill="#4F46E5"/><text x="65" y="683" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="65" dy="0">File reading</tspan></text><text x="65" y="709" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="65" dy="0">Suffix-specific readers</tspan><tspan x="65" dy="21">read_repository_files()</tspan></text><rect id="source-units" x="373" y="656" width="293" height="116" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="373" y="656" width="6" height="116" rx="3" fill="#4F46E5"/><text x="393" y="683" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="393" dy="0">SourceUnit records</tspan></text><text x="393" y="709" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="393" dy="0">Path, kind, line / page / cell</tspan><tspan x="393" dy="21">Symbol / section provenance</tspan></text><rect id="chunks" x="694" y="656" width="290" height="116" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="694" y="656" width="6" height="116" rx="3" fill="#4F46E5"/><text x="714" y="683" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="714" dy="0">Chunk records</tspan></text><text x="714" y="709" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="714" dy="0">Embedding tokenizer boundaries</tspan><tspan x="714" dy="21">Stable IDs + coordinates</tspan></text><rect id="retrieval" x="1014" y="656" width="221" height="116" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="1014" y="656" width="6" height="116" rx="3" fill="#059669"/><text x="1034" y="683" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="1034" dy="0">Retrieval indexes</tspan></text><text x="1034" y="709" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="1034" dy="0">Semantic vectors</tspan><tspan x="1034" dy="21">Lexical + code data</tspan></text>


