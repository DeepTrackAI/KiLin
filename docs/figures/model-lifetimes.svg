<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="810" viewBox="0 0 1280 810" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Model session lifecycle</title>
<desc id="figure-description">The RAG session constructs embedding and chat sessions and may use a separate router model. Switching conversation reuses compatible sessions and indexes. Backend behavior differs for MLX and PyTorch; closing the session releases references.</desc>

<defs>
  <marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#64748B" stroke-width="1.4" stroke-linecap="round"/></marker>
  <marker id="arrow-indigo" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#4F46E5" stroke-width="1.4" stroke-linecap="round"/></marker>
  <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#059669" stroke-width="1.4" stroke-linecap="round"/></marker>
  <marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#D97706" stroke-width="1.4" stroke-linecap="round"/></marker>
  <marker id="arrow-rose" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#E11D48" stroke-width="1.4" stroke-linecap="round"/></marker>
</defs>
<style>
  text { font-family: Inter, 'Avenir Next', 'Segoe UI', Arial, sans-serif; }
</style>

<rect x="0" y="0" width="1280" height="810" fill="#FFFFFF"/>
<rect x="0" y="0" width="1280" height="9" fill="#4F46E5"/>
<text x="45" y="43" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="750" fill="#0F172A">Model session lifecycle</text>
<text x="46" y="74" font-family="Inter, Arial, sans-serif" font-size="16" fill="#64748B">A project RAGSession owns live models; saved conversations remain independent</text>
<line x1="43" y1="91" x2="1237" y2="91" stroke="#E2E8F0" stroke-width="1.5"/>

<rect id="live-models" x="367" y="131" width="525" height="340" rx="18" fill="#EEF2FF" stroke="#DFE5EE" stroke-width="1.6"/><text x="385" y="156" fill="#3730A3" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="385" dy="0">LIVE MODEL SESSIONS (IN MEMORY)</tspan></text>
<polyline points="330,204 385,204" fill="none" stroke="#4F46E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><polyline points="330,251 358,251 358,365 450,365" fill="none" stroke="#D97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-amber)"/><polyline points="330,223 359,223 359,182 751,182 751,190" fill="none" stroke="#4F46E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><polyline points="870,259 929,231" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/><polyline points="199,542 199,489 514,489 514,471" fill="none" stroke="#4F46E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><polyline points="750,318 850,318 850,508 642,508 642,541" fill="none" stroke="#D97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-amber)"/><polyline points="892,453 1022,453 1022,541" fill="none" stroke="#E11D48" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-rose)"/>
<rect id="rag-open" x="42" y="150" width="288" height="106" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="42" y="150" width="6" height="106" rx="3" fill="#4F46E5"/><text x="62" y="177" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="62" dy="0">RAGSession(project)</tspan></text><text x="62" y="203" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="62" dy="0">Open saved project + indexes</tspan><tspan x="62" dy="21">Select backend / model identity</tspan></text><rect id="embedding-session" x="388" y="191" width="234" height="127" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="388" y="191" width="6" height="127" rx="3" fill="#4F46E5"/><text x="408" y="218" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="408" dy="0">EmbeddingSession</tspan></text><text x="408" y="244" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="408" dy="0">Tokenizer + model</tspan><tspan x="408" dy="21">Document/query vectors</tspan><tspan x="408" dy="21">Token counts</tspan></text><rect id="chat-session" x="635" y="191" width="235" height="127" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="635" y="191" width="6" height="127" rx="3" fill="#4F46E5"/><text x="655" y="218" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="655" dy="0">ChatSession</tspan></text><text x="655" y="244" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="655" dy="0">Tokenizer + chat model</tspan><tspan x="655" dy="21">Generation / history</tspan><tspan x="655" dy="21">Validated settings</tspan></text><rect id="router-model" x="450" y="344" width="360" height="96" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="450" y="344" width="6" height="96" rx="3" fill="#D97706"/><text x="470" y="371" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="470" dy="0">Router model (optional)</tspan></text><text x="470" y="397" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="470" dy="0">Share answering session when same ID</tspan><tspan x="470" dy="21">Otherwise load separate ChatSession</tspan></text><rect id="model-persisted" x="930" y="166" width="303" height="128" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="930" y="166" width="6" height="128" rx="3" fill="#059669"/><text x="950" y="193" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="950" dy="0">Persisted project state</tspan></text><text x="950" y="219" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="950" dy="0">profile.ini + validated indexes</tspan><tspan x="950" dy="21">Conversation JSON / checkpoints</tspan><tspan x="950" dy="21">Survive session and engine restart</tspan></text><rect id="switch-conversation" x="62" y="542" width="341" height="124" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="62" y="542" width="6" height="124" rx="3" fill="#0284C7"/><text x="82" y="569" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="82" dy="0">Switch conversation</tspan></text><text x="82" y="595" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="82" dy="0">Update saved active conversation</tspan><tspan x="82" dy="21">Restore history; reuse loaded models</tspan><tspan x="82" dy="21">and compatible indexes</tspan></text><rect id="backend-policy" x="471" y="542" width="341" height="124" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="471" y="542" width="6" height="124" rx="3" fill="#D97706"/><text x="491" y="569" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="491" dy="0">Backend-specific policy</tspan></text><text x="491" y="595" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="491" dy="0">MLX: token callbacks; some switches</tspan><tspan x="491" dy="21">PyTorch: blocking output, one</tspan><tspan x="491" dy="21">active answering model</tspan></text><rect id="close-models" x="880" y="542" width="341" height="124" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="880" y="542" width="6" height="124" rx="3" fill="#E11D48"/><text x="900" y="569" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="900" dy="0">Close / Stop / process exit</tspan></text><text x="900" y="595" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="900" dy="0">Release model references, trace, locks</tspan><tspan x="900" dy="21">GUI Stop kills engine subprocess</tspan><tspan x="900" dy="21">Unsaved partial output is lost</tspan></text>


<rect x="0" y="760" width="1280" height="50" fill="#F8FAFC"/>
<line x1="44" y1="760" x2="1236" y2="760" stroke="#E2E8F0"/>
