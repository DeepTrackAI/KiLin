<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Local data and trust boundaries</title>
<desc id="figure-description">User-owned sources and workspaces are local. KíLín core and its model backends also execute locally, but retrieved text is untrusted evidence. Explicit downloads or dependency setup may contact remote services. KíLín does not guarantee encryption or a secure sandbox.</desc>

<defs>
  <marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#64748B" stroke-width="1.4" stroke-linecap="round"/></marker>
  <marker id="arrow-indigo" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#4F46E5" stroke-width="1.4" stroke-linecap="round"/></marker>
  <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#059669" stroke-width="1.4" stroke-linecap="round"/></marker>
  <marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#D97706" stroke-width="1.4" stroke-linecap="round"/></marker>
  <marker id="arrow-rose" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#E11D48" stroke-width="1.4" stroke-linecap="round"/></marker>
</defs>
<style>
  text { font-family: Inter, 'Avenir Next', 'Segoe UI', Arial, sans-serif; }
</style>

<rect x="0" y="0" width="1280" height="820" fill="#FFFFFF"/>
<rect x="0" y="0" width="1280" height="9" fill="#4F46E5"/>
<text x="45" y="43" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="750" fill="#0F172A">Local data and trust boundaries</text>
<text x="46" y="74" font-family="Inter, Arial, sans-serif" font-size="16" fill="#64748B">Local-first execution does not imply that untrusted evidence is safe or that downloads cannot occur</text>
<line x1="43" y1="91" x2="1237" y2="91" stroke="#E2E8F0" stroke-width="1.5"/>

<rect id="user-data-zone" x="40" y="128" width="551" height="515" rx="18" fill="#DDF7EB" stroke="#DFE5EE" stroke-width="1.6"/><text x="58" y="153" fill="#065F46" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="58" dy="0">LOCAL USER-OWNED DATA</tspan></text><rect id="local-process-zone" x="620" y="128" width="318" height="515" rx="18" fill="#EEF2FF" stroke="#DFE5EE" stroke-width="1.6"/><text x="638" y="153" fill="#3730A3" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="638" dy="0">LOCAL KILIN PROCESSES</tspan></text><rect id="external-zone" x="963" y="128" width="275" height="515" rx="18" fill="#FFF1F2" stroke="#DFE5EE" stroke-width="1.6"/><text x="981" y="153" fill="#9F1239" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="981" dy="0">OUTSIDE HOST (OPTIONAL)</tspan></text>
<polyline points="304,254 330,254" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/><polyline points="570,254 640,254" fill="none" stroke="#4F46E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><polyline points="778,328 778,392" fill="none" stroke="#4F46E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><polyline points="915,469 951,469 951,340 985,340" fill="none" stroke="#D97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-amber)"/>
<rect id="user-sources" x="59" y="186" width="245" height="137" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="59" y="186" width="6" height="137" rx="3" fill="#D97706"/><text x="79" y="213" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="79" dy="0">Original sources</tspan></text><text x="79" y="239" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="79" dy="0">User-selected documents</tspan><tspan x="79" dy="21">Potential sensitive content</tspan><tspan x="79" dy="21">Untrusted instructions</tspan></text><rect id="workspace-files" x="331" y="186" width="239" height="137" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="331" y="186" width="6" height="137" rx="3" fill="#059669"/><text x="351" y="213" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="351" dy="0">Workspace files</tspan></text><text x="351" y="239" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="351" dy="0">Source copies + indexes</tspan><tspan x="351" dy="21">Outputs + conversations</tspan><tspan x="351" dy="21">Traces / advisory locks</tspan></text><rect id="trusted-core" x="641" y="185" width="274" height="143" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="641" y="185" width="6" height="143" rx="3" fill="#4F46E5"/><text x="661" y="212" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="661" dy="0">KíLín core + tools</tspan></text><text x="661" y="238" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="661" dy="0">Path and settings checks</tspan><tspan x="661" dy="21">Sources treated as evidence</tspan><tspan x="661" dy="21">No OS execution sandbox</tspan></text><rect id="local-backend" x="641" y="393" width="274" height="158" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="641" y="393" width="6" height="158" rx="3" fill="#4F46E5"/><text x="661" y="420" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="661" dy="0">Local model backend</tspan></text><text x="661" y="446" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="661" dy="0">MLX / PyTorch + cached models</tspan><tspan x="661" dy="21">Untrusted answers possible</tspan><tspan x="661" dy="21">Human review required</tspan></text><rect id="external-services" x="986" y="236" width="230" height="170" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="986" y="236" width="6" height="170" rx="3" fill="#E11D48"/><text x="1006" y="263" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="1006" dy="0">External services</tspan></text><text x="1006" y="289" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="1006" dy="0">Hugging Face repositories</tspan><tspan x="1006" dy="21">Package indexes via uv</tspan><tspan x="1006" dy="21">Only on permitted paths</tspan><tspan x="1006" dy="21">Not a network firewall</tspan></text><rect x="65" y="391" width="499" height="58" rx="9" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.6"/><text x="79" y="408" fill="#9F1239" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="79" dy="0">Scans and selection reason codes are not</tspan><tspan x="79" dy="20">an access-control boundary</tspan></text><rect x="65" y="530" width="499" height="58" rx="9" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/><text x="79" y="547" fill="#334155" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="79" dy="0">Protect workspace files and diagnostic traces</tspan><tspan x="79" dy="20">with host filesystem / sharing policies</tspan></text><rect x="993" y="464" width="210" height="58" rx="9" fill="#FFF2D9" stroke="#D97706" stroke-width="1.6"/><text x="1007" y="481" fill="#92400E" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="1007" dy="0">Explicit downloads or</tspan><tspan x="1007" dy="20">dependency bootstrap only</tspan></text>


<rect x="0" y="770" width="1280" height="50" fill="#F8FAFC"/>
<line x1="44" y1="770" x2="1236" y2="770" stroke="#E2E8F0"/>
<text x="45" y="800" font-size="13" fill="#475569" font-family="Inter,Arial,sans-serif">No encrypted workspace, prompt-injection defense or secure execution sandbox is guaranteed by KíLín</text>
<text x="1235" y="800" text-anchor="end" font-size="12" fill="#64748B" font-family="Inter,Arial,sans-serif">KíLín · PR9b</text>

</svg>
