<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Configuration: creation versus reopening</title>
<desc id="figure-description">Packaged core defaults and project-type JSON are validated when creating a project; its profile.ini is authoritative on reopen. GUI defaults plus sparse user preferences supply initial UI values. Tool packages have separate defaults.</desc>

<defs>
  <marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#64748B" stroke-width="1.4" stroke-linecap="round"/></marker>
  <marker id="arrow-indigo" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#4F46E5" stroke-width="1.4" stroke-linecap="round"/></marker>
  <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#059669" stroke-width="1.4" stroke-linecap="round"/></marker>
  <marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#D97706" stroke-width="1.4" stroke-linecap="round"/></marker>
  <marker id="arrow-rose" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#E11D48" stroke-width="1.4" stroke-linecap="round"/></marker>
</defs>
<style>
  text { font-family: Inter, 'Avenir Next', 'Segoe UI', Arial, sans-serif; }
</style>

<rect x="0" y="0" width="1280" height="840" fill="#FFFFFF"/>
<rect x="0" y="0" width="1280" height="9" fill="#4F46E5"/>
<text x="45" y="43" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="750" fill="#0F172A">Configuration: creation versus reopening</text>
<text x="46" y="74" font-family="Inter, Arial, sans-serif" font-size="16" fill="#64748B">Project settings have different owners; saved profiles outrank new-project defaults</text>
<line x1="43" y1="91" x2="1237" y2="91" stroke="#E2E8F0" stroke-width="1.5"/>

<rect id="project-inputs" x="40" y="120" width="570" height="269" rx="18" fill="#FFF2D9" stroke="#DFE5EE" stroke-width="1.6"/><text x="58" y="145" fill="#92400E" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="58" dy="0">PROJECT CREATION INPUTS</tspan></text><rect id="gui-inputs" x="637" y="120" width="597" height="269" rx="18" fill="#E0F2FE" stroke="#DFE5EE" stroke-width="1.6"/><text x="655" y="145" fill="#075985" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="655" dy="0">DESKTOP INITIALIZATION INPUTS</tspan></text>
<polyline points="186,328 186,445 344,445 344,480" fill="none" stroke="#D97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/><polyline points="460,328 460,480" fill="none" stroke="#D97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/><polyline points="582,558 691,558" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/><polyline points="866,620 866,660 664,660 664,685" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<rect id="config-core" x="62" y="176" width="249" height="152" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="62" y="176" width="6" height="152" rx="3" fill="#D97706"/><text x="82" y="203" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="82" dy="0">Core defaults</tspan></text><text x="82" y="229" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="82" dy="0">kilin_defaults.json</tspan><tspan x="82" dy="21">Models, scans and profiles</tspan><tspan x="82" dy="21">Read-only resource</tspan></text><rect id="config-type" x="336" y="176" width="250" height="152" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="336" y="176" width="6" height="152" rx="3" fill="#D97706"/><text x="356" y="203" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="356" dy="0">Project type JSON</tspan></text><text x="356" y="229" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="356" dy="0">code.json / literature.json</tspan><tspan x="356" dy="21">Intents + source policy</tspan><tspan x="356" dy="21">Project-kind declarations</tspan></text><rect id="config-gui-defaults" x="659" y="176" width="260" height="152" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="659" y="176" width="6" height="152" rx="3" fill="#0284C7"/><text x="679" y="203" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="679" dy="0">GUI defaults</tspan></text><text x="679" y="229" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="679" dy="0">gui/defaults.json</tspan><tspan x="679" dy="21">Appearance + UI choices</tspan><tspan x="679" dy="21">Read-only, not user state</tspan></text><rect id="config-user" x="939" y="176" width="274" height="152" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="939" y="176" width="6" height="152" rx="3" fill="#0284C7"/><text x="959" y="203" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="959" dy="0">User preferences</tspan></text><text x="959" y="229" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="959" dy="0">preferences.json</tspan><tspan x="959" dy="21">Sparse app-wide overrides</tspan><tspan x="959" dy="21">User-owned, writable</tspan></text><rect id="config-create" x="250" y="481" width="332" height="139" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="250" y="481" width="6" height="139" rx="3" fill="#4F46E5"/><text x="270" y="508" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="270" dy="0">New project initialization</tspan></text><text x="270" y="534" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="270" dy="0">Validate resource plan and values</tspan><tspan x="270" dy="21">Write profile.ini last</tspan><tspan x="270" dy="21">Do not migrate existing projects</tspan></text><rect id="config-reopen" x="692" y="481" width="346" height="139" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="692" y="481" width="6" height="139" rx="3" fill="#059669"/><text x="712" y="508" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="712" dy="0">Existing saved project</tspan></text><text x="712" y="534" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="712" dy="0">profile.ini is authoritative</tspan><tspan x="712" dy="21">Backend, model, search + GUI fields</tspan><tspan x="712" dy="21">On reopening, do not replace</tspan></text><rect id="config-effective" x="386" y="686" width="508" height="86" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="386" y="686" width="6" height="86" rx="3" fill="#4F46E5"/><text x="406" y="713" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="406" dy="0">Resolved effective project operation</tspan></text><text x="406" y="739" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="406" dy="0">Validated intent + project profile + per-turn options</tspan></text><rect x="661" y="410" width="530" height="58" rx="9" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.6"/><text x="675" y="427" fill="#075985" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="675" dy="0">GUI preferences set UI defaults; saved project</tspan><tspan x="675" dy="20">settings remain authoritative on reopening</tspan></text><rect x="62" y="424" width="553" height="38" rx="9" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6"/><text x="76" y="441" fill="#334155" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="76" dy="0">Tool-specific defaults are owned by individual registered tools</tspan></text>
<text x="635" y="539" fill="#059669" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="635" dy="0">save</tspan></text>

<rect x="0" y="790" width="1280" height="50" fill="#F8FAFC"/>
<line x1="44" y1="790" x2="1236" y2="790" stroke="#E2E8F0"/>
<text x="45" y="820" font-size="13" fill="#475569" font-family="Inter,Arial,sans-serif">GUI appearance is application-wide · project fields take precedence for an existing project · tool defaults are separate</text>
<text x="1235" y="820" text-anchor="end" font-size="12" fill="#64748B" font-family="Inter,Arial,sans-serif">KíLín · PR9b</text>

</svg>
