<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="830" viewBox="0 0 1280 830" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Conversation writers and atomic checkpoints</title>
<desc id="figure-description">A session or ConversationStore acquires an advisory lock on the stable companion file. The writer validates state then writes a temporary JSON and atomically replaces the conversation file. Conflicting acquisitions fail without overwriting it.</desc>

<defs>
  <marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#64748B" stroke-width="1.4" stroke-linecap="round"/></marker>
  <marker id="arrow-indigo" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#4F46E5" stroke-width="1.4" stroke-linecap="round"/></marker>
  <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#059669" stroke-width="1.4" stroke-linecap="round"/></marker>
  <marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#D97706" stroke-width="1.4" stroke-linecap="round"/></marker>
  <marker id="arrow-rose" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#E11D48" stroke-width="1.4" stroke-linecap="round"/></marker>
</defs>
<style>
  text { font-family: Inter, 'Avenir Next', 'Segoe UI', Arial, sans-serif; }
</style>

<rect x="0" y="0" width="1280" height="830" fill="#FFFFFF"/>
<rect x="0" y="0" width="1280" height="9" fill="#4F46E5"/>
<text x="45" y="43" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="750" fill="#0F172A">Conversation writers and atomic checkpoints</text>
<text x="46" y="74" font-family="Inter, Arial, sans-serif" font-size="16" fill="#64748B">At most one cooperative writer owns a canonical conversation JSON path</text>
<line x1="43" y1="91" x2="1237" y2="91" stroke="#E2E8F0" stroke-width="1.5"/>


<polyline points="354,200 385,200 385,276 420,276" fill="none" stroke="#4F46E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><polyline points="354,384 386,384 386,331 420,331" fill="none" stroke="#4F46E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><polyline points="790,274 816,274 816,203 853,203" fill="none" stroke="#4F46E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><polyline points="1030,259 1030,322" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/><polyline points="1022,445 1022,491 765,491 765,535" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/><polyline points="604,377 604,487 240,487 240,534" fill="none" stroke="#E11D48" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-rose)"/>
<rect id="writer-session" x="57" y="142" width="297" height="116" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="57" y="142" width="6" height="116" rx="3" fill="#4F46E5"/><text x="77" y="169" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="77" dy="0">Session / TraceLogger</tspan></text><text x="77" y="195" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="77" dy="0">Tracing enabled: logger owns lock</tspan><tspan x="77" dy="21">Tracing off: session owns lock</tspan></text><rect id="writer-store" x="57" y="323" width="297" height="116" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="57" y="323" width="6" height="116" rx="3" fill="#4F46E5"/><text x="77" y="350" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="77" dy="0">ConversationStore</tspan></text><text x="77" y="376" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="77" dy="0">Inactive: temporary lock</tspan><tspan x="77" dy="21">Active: borrow valid owner token</tspan></text><rect id="companion-lock" x="421" y="232" width="369" height="145" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="421" y="232" width="6" height="145" rx="3" fill="#D97706"/><text x="441" y="259" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="441" dy="0">Hidden companion .json.lock</tspan></text><text x="441" y="285" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="441" dy="0">Canonical path + process-local registry</tspan><tspan x="441" dy="21">Nonblocking flock or msvcrt.locking</tspan><tspan x="441" dy="21">Lock inode survives JSON replace</tspan></text><rect id="read-state" x="854" y="141" width="352" height="118" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="854" y="141" width="6" height="118" rx="3" fill="#4F46E5"/><text x="874" y="168" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="874" dy="0">Read / validate state</tspan></text><text x="874" y="194" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="874" dy="0">Select/open/switch target safely</tspan><tspan x="874" dy="21">Target ownership before prior release</tspan></text><rect id="atomic-checkpoint" x="854" y="323" width="352" height="122" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="854" y="323" width="6" height="122" rx="3" fill="#059669"/><text x="874" y="350" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="874" dy="0">Atomic checkpoint</tspan></text><text x="874" y="376" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="874" dy="0">Unique temporary JSON file</tspan><tspan x="874" dy="21">os.replace() updates one file</tspan><tspan x="874" dy="21">Committed turn + trace events</tspan></text><rect id="conversation-json" x="527" y="536" width="379" height="125" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="527" y="536" width="6" height="125" rx="3" fill="#059669"/><text x="547" y="563" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="547" dy="0">conversation_*.json</tspan></text><text x="547" y="589" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="547" dy="0">Durable saved turns and trace events</tspan><tspan x="547" dy="21">User-owned in project logs/traces/</tspan><tspan x="547" dy="21">Lock companion is not conversation data</tspan></text><rect id="writer-conflict" x="57" y="535" width="372" height="126" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="57" y="535" width="6" height="126" rx="3" fill="#E11D48"/><text x="77" y="562" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="77" dy="0">Conflicting writer</tspan></text><text x="77" y="588" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="77" dy="0">ConversationLockedError immediately</tspan><tspan x="77" dy="21">No overwrite; existing owner continues</tspan><tspan x="77" dy="21">Do not delete an active .lock companion</tspan></text><rect x="946" y="607" width="272" height="58" rx="9" fill="#FFF2D9" stroke="#D97706" stroke-width="1.6"/><text x="960" y="624" fill="#92400E" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="960" dy="0">Failed write keeps prior destination</tspan><tspan x="960" dy="20">Temporary file is removed</tspan></text>


<rect x="0" y="780" width="1280" height="50" fill="#F8FAFC"/>
<line x1="44" y1="780" x2="1236" y2="780" stroke="#E2E8F0"/>
<text x="45" y="810" font-size="13" fill="#475569" font-family="Inter,Arial,sans-serif">Advisory locks coordinate KíLín writers, not hostile local processes · single-file atomicity is not a database</text>
<text x="1235" y="810" text-anchor="end" font-size="12" fill="#64748B" font-family="Inter,Arial,sans-serif">KíLín</text>

</svg>
