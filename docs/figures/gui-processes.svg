<rect x="0" y="0" width="1280" height="830" fill="#FFFFFF"/>
<rect x="0" y="0" width="1280" height="9" fill="#4F46E5"/>
<text x="45" y="43" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="750" fill="#0F172A">Desktop process and message boundaries</text>
<text x="46" y="74" font-family="Inter, Arial, sans-serif" font-size="16" fill="#64748B">QWebChannel links the page to Qt; JSON-line IPC links Qt to the engine child</text>
<line x1="43" y1="91" x2="1237" y2="91" stroke="#E2E8F0" stroke-width="1.5"/>

<rect id="qt-process" x="45" y="124" width="580" height="535" rx="18" fill="#E0F2FE" stroke="#DFE5EE" stroke-width="1.6"/><text x="63" y="149" fill="#075985" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="63" dy="0">QT APPLICATION PROCESS</tspan></text><rect id="engine-process" x="657" y="124" width="578" height="535" rx="18" fill="#EEF2FF" stroke="#DFE5EE" stroke-width="1.6"/><text x="675" y="149" fill="#3730A3" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="675" dy="0">ENGINE SUBPROCESS — SEPARATE PROCESS</tspan></text>
<polyline points="318,235 351,235" fill="none" stroke="#0284C7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/><polyline points="351,307 318,307" fill="none" stroke="#0284C7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gray)"/><polyline points="603,239 679,239" fill="none" stroke="#4F46E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><polyline points="679,307 603,307" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/><polyline points="924,265 958,265" fill="none" stroke="#4F46E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><polyline points="444,348 444,430" fill="none" stroke="#E11D48" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-rose)"/><polyline points="814,348 814,430" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<rect id="web-page" x="67" y="187" width="251" height="161" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="67" y="187" width="6" height="161" rx="3" fill="#0284C7"/><text x="87" y="214" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="87" dy="0">Local web page</tspan></text><text x="87" y="240" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="87" dy="0">QWebEngineView: HTML</tspan><tspan x="87" dy="21">app.js: presentation state</tspan><tspan x="87" dy="21">onEvent(): JSON events</tspan></text><rect id="qt-bridge" x="352" y="187" width="251" height="161" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="352" y="187" width="6" height="161" rx="3" fill="#0284C7"/><text x="372" y="214" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="372" dy="0">Qt window / bridge</tspan></text><text x="372" y="240" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="372" dy="0">QWebChannel slots/signals</tspan><tspan x="372" dy="21">Dialogs + QProcess</tspan><tspan x="372" dy="21">Native actions in window.py</tspan></text><rect id="chat-engine" x="680" y="187" width="244" height="161" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="680" y="187" width="6" height="161" rx="3" fill="#4F46E5"/><text x="700" y="214" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="700" dy="0">Engine subprocess</tspan></text><text x="700" y="240" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="700" dy="0">Reads JSON commands</tspan><tspan x="700" dy="21">Emits one event per line</tspan><tspan x="700" dy="21">Can pause for plan_choice</tspan></text><rect id="gui-core" x="959" y="187" width="252" height="161" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="959" y="187" width="6" height="161" rx="3" fill="#4F46E5"/><text x="979" y="214" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="979" dy="0">KíLín core</tspan></text><text x="979" y="240" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="979" dy="0">RAGSession + tools / models</tspan><tspan x="979" dy="21">Retrieval + source access</tspan><tspan x="979" dy="21">Trace and conversation I/O</tspan></text><text x="93" y="385" fill="#075985" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="93" dy="0">QWebChannel: slots → · signals ←</tspan></text><text x="701" y="385" fill="#3730A3" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="701" dy="0">JSON lines: commands → · events ←</tspan></text><rect id="gui-stop" x="86" y="431" width="492" height="136" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="86" y="431" width="6" height="136" rx="3" fill="#E11D48"/><text x="106" y="458" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="106" dy="0">Stop / restart</tspan></text><text x="106" y="484" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="106" dy="0">Answer Stop requests cancellation; models stay loaded</tspan><tspan x="106" dy="21">Timeout / other-operation Stop restarts the engine</tspan><tspan x="106" dy="21">Resume the saved conversation, not partial generation</tspan></text><rect id="gui-persisted" x="699" y="431" width="494" height="136" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="699" y="431" width="6" height="136" rx="3" fill="#059669"/><text x="719" y="458" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="719" dy="0">Per-project committed data</tspan></text><text x="719" y="484" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="719" dy="0">profile.ini, indexes and managed sources</tspan><tspan x="719" dy="21">conversation_*.json + trace checkpoints</tspan><tspan x="719" dy="21">Persistent across engine restarts</tspan></text><rect x="69" y="593" width="506" height="38" rx="9" fill="#FFF2D9" stroke="#D97706" stroke-width="1.6"/><text x="83" y="610" fill="#92400E" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="83" dy="0">Frontend receives validated reason codes in settings events</tspan></text><rect x="700" y="593" width="510" height="38" rx="9" fill="#FFF2D9" stroke="#D97706" stroke-width="1.6"/><text x="714" y="610" fill="#92400E" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="714" dy="0">Optional PDF writer is a GUI-provided callback, not a core dependency</tspan></text>


