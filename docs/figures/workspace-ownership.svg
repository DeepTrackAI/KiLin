<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Workspace and configuration ownership</title>
<desc id="figure-description">Packaged resources are immutable. Sparse per-user GUI preferences are writable. Development workspaces default to repository sandbox; installed workspaces to user data. Each project stores a saved profile, indexes, managed sources, traces, outputs and templates.</desc>

<defs>
  <marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#64748B" stroke-width="1.4" stroke-linecap="round"/></marker>
  <marker id="arrow-indigo" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#4F46E5" stroke-width="1.4" stroke-linecap="round"/></marker>
  <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#059669" stroke-width="1.4" stroke-linecap="round"/></marker>
  <marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#D97706" stroke-width="1.4" stroke-linecap="round"/></marker>
  <marker id="arrow-rose" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#E11D48" stroke-width="1.4" stroke-linecap="round"/></marker>
</defs>
<style>
  text { font-family: Inter, 'Avenir Next', 'Segoe UI', Arial, sans-serif; }
</style>

<rect x="0" y="0" width="1280" height="800" fill="#FFFFFF"/>
<rect x="0" y="0" width="1280" height="9" fill="#4F46E5"/>
<text x="45" y="43" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="750" fill="#0F172A">Workspace and configuration ownership</text>
<text x="46" y="74" font-family="Inter, Arial, sans-serif" font-size="16" fill="#64748B">Packaged defaults, user preferences and project state have different owners</text>
<line x1="43" y1="91" x2="1237" y2="91" stroke="#E2E8F0" stroke-width="1.5"/>

<rect id="package-zone" x="42" y="114" width="380" height="230" rx="18" fill="#FFF2D9" stroke="#DFE5EE" stroke-width="1.6"/><text x="60" y="139" fill="#92400E" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="60" dy="0">INSTALLED PACKAGE — READ-ONLY</tspan></text><rect id="user-zone" x="451" y="114" width="366" height="230" rx="18" fill="#E0F2FE" stroke="#DFE5EE" stroke-width="1.6"/><text x="469" y="139" fill="#075985" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="469" dy="0">PER-USER GUI DATA</tspan></text><rect id="parent-zone" x="847" y="114" width="391" height="230" rx="18" fill="#DDF7EB" stroke="#DFE5EE" stroke-width="1.6"/><text x="865" y="139" fill="#065F46" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="865" dy="0">DEFAULT WORKSPACE PARENT</tspan></text><rect id="one-project" x="91" y="393" width="1098" height="327" rx="18" fill="#DDF7EB" stroke="#DFE5EE" stroke-width="1.6"/><text x="109" y="418" fill="#065F46" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="109" dy="0">ONE PROJECT — PERSISTENT FILES</tspan></text>
<polyline points="249,314 249,373 228,373 228,391" fill="none" stroke="#D97706" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-amber)"/><polyline points="650,314 650,364 670,364 670,393" fill="none" stroke="#0284C7" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/><polyline points="1042,314 1042,392" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<rect id="packaged-config" x="62" y="169" width="336" height="145" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="62" y="169" width="6" height="145" rx="3" fill="#D97706"/><text x="82" y="196" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="82" dy="0">Packaged resources</tspan></text><text x="82" y="222" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="82" dy="0">qachat_defaults.json / project types</tspan><tspan x="82" dy="21">gui/defaults.json / tool defaults</tspan><tspan x="82" dy="21">Read and validate; do not rewrite</tspan></text><rect id="user-preferences" x="472" y="169" width="324" height="145" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="472" y="169" width="6" height="145" rx="3" fill="#0284C7"/><text x="492" y="196" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="492" dy="0">GUI preferences</tspan></text><text x="492" y="222" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="492" dy="0">preferences.json (sparse overrides)</tspan><tspan x="492" dy="21">Appearance + initial GUI choices</tspan><tspan x="492" dy="21">Stored outside the installation</tspan></text><rect id="workspace-location" x="868" y="169" width="348" height="145" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="868" y="169" width="6" height="145" rx="3" fill="#059669"/><text x="888" y="196" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="888" dy="0">Workspace location</tspan></text><text x="888" y="222" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="888" dy="0">Checkout → repository sandbox/</tspan><tspan x="888" dy="21">Installed → per-user data directory</tspan><tspan x="888" dy="21">Explicit paths can override</tspan></text><rect id="profile" x="118" y="480" width="218" height="122" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="118" y="480" width="6" height="122" rx="3" fill="#4F46E5"/><text x="138" y="507" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="138" dy="0">profile.ini</tspan></text><text x="138" y="533" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="138" dy="0">Saved backend / models</tspan><tspan x="138" dy="21">Retrieval + GUI settings</tspan><tspan x="138" dy="21">Authority on reopen</tspan></text><rect id="managed-sources" x="355" y="480" width="220" height="122" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="355" y="480" width="6" height="122" rx="3" fill="#059669"/><text x="375" y="507" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="375" dy="0">Managed sources</tspan></text><text x="375" y="533" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="375" dy="0">sources/ + sources.json</tspan><tspan x="375" dy="21">or source_snapshot.json</tspan><tspan x="375" dy="21">User originals stay intact</tspan></text><rect id="index-files" x="592" y="480" width="220" height="122" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="592" y="480" width="6" height="122" rx="3" fill="#059669"/><text x="612" y="507" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="612" dy="0">indexes/</tspan></text><text x="612" y="533" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="612" dy="0">Vectors + lexical data</tspan><tspan x="612" dy="21">Graph + fingerprints</tspan><tspan x="612" dy="21">Rebuildable cache</tspan></text><rect id="conversation-files" x="829" y="480" width="326" height="122" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="829" y="480" width="6" height="122" rx="3" fill="#059669"/><text x="849" y="507" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="849" dy="0">logs/traces/</tspan></text><text x="849" y="533" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="849" dy="0">conversation_*.json + .lock</tspan><tspan x="849" dy="21">Committed turns + optional trace</tspan><tspan x="849" dy="21">Advisory ownership / atomic writes</tspan></text><rect id="output-folders" x="355" y="624" width="457" height="70" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="355" y="624" width="6" height="70" rx="3" fill="#64748B"/><text x="375" y="651" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="375" dy="0">outputs/ + templates/</tspan></text><text x="375" y="677" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="375" dy="0">Project-owned files; not indexed as source by default</tspan></text><text x="318" y="450" fill="#065F46" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="318" dy="0">New resources are validated; saved project profiles are never overwritten.</tspan></text>
<text x="186" y="359" fill="#D97706" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="186" dy="0">new project</tspan></text><text x="592" y="353" fill="#0284C7" font-size="13" font-weight="600" text-anchor="middle" dominant-baseline="middle"><tspan x="592" dy="0">GUI choices</tspan></text>

<rect x="0" y="750" width="1280" height="50" fill="#F8FAFC"/>
<line x1="44" y1="750" x2="1236" y2="750" stroke="#E2E8F0"/>
<text x="45" y="780" font-size="13" fill="#475569" font-family="Inter,Arial,sans-serif">Persisted files are user-owned · source copies are separate from originals · folder organization ≠ sandboxing</text>
<text x="1235" y="780" text-anchor="end" font-size="12" fill="#64748B" font-family="Inter,Arial,sans-serif">QAChat · PR9b</text>

</svg>
