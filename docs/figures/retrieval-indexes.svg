<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Hybrid retrieval and index persistence</title>
<desc id="figure-description">The semantic, lexical and code-graph channels rank the same source chunks. Reciprocal-rank fusion combines ranked lists; named-document routing may add scoped context. Validated indexes persist with model identity and checksum.</desc>

<defs>
  <marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#64748B" stroke-width="1.4" stroke-linecap="round"/></marker>
  <marker id="arrow-indigo" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#4F46E5" stroke-width="1.4" stroke-linecap="round"/></marker>
  <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#059669" stroke-width="1.4" stroke-linecap="round"/></marker>
  <marker id="arrow-amber" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#D97706" stroke-width="1.4" stroke-linecap="round"/></marker>
  <marker id="arrow-rose" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M1,1 L7,4 L1,7" fill="none" stroke="#E11D48" stroke-width="1.4" stroke-linecap="round"/></marker>
</defs>
<style>
  text { font-family: Inter, 'Avenir Next', 'Segoe UI', Arial, sans-serif; }
</style>

<rect x="0" y="0" width="1280" height="850" fill="#FFFFFF"/>
<rect x="0" y="0" width="1280" height="9" fill="#4F46E5"/>
<text x="45" y="43" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="750" fill="#0F172A">Hybrid retrieval and index persistence</text>
<text x="46" y="74" font-family="Inter, Arial, sans-serif" font-size="16" fill="#64748B">Three ranked channels share provenance-bearing chunks; their raw scores are not fused</text>
<line x1="43" y1="91" x2="1237" y2="91" stroke="#E2E8F0" stroke-width="1.5"/>

<rect id="ranking-channels" x="47" y="277" width="1185" height="283" rx="18" fill="#F1F5F9" stroke="#DFE5EE" stroke-width="1.6"/><text x="65" y="302" fill="#334155" font-size="14" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="65" dy="0">THREE RANKING CHANNELS</tspan></text>
<polyline points="239,228 239,259 243,259 243,332" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/><polyline points="239,259 640,259 640,332" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/><polyline points="239,259 1034,259 1034,332" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/><polyline points="1038,228 1038,244 1057,244 1057,332" fill="none" stroke="#4F46E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><polyline points="1038,244 641,244 641,332" fill="none" stroke="#4F46E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><polyline points="1038,244 291,244 291,332" fill="none" stroke="#4F46E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><polyline points="240,517 240,580 392,580 392,635" fill="none" stroke="#4F46E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><polyline points="639,517 639,581 488,581 488,635" fill="none" stroke="#4F46E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><polyline points="1034,517 1034,600 574,600 574,635" fill="none" stroke="#4F46E5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-indigo)"/><polyline points="647,697 684,697" fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
<rect id="indexed-chunks" x="46" y="126" width="383" height="102" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="46" y="126" width="6" height="102" rx="3" fill="#059669"/><text x="66" y="153" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="66" dy="0">Indexed Chunk records</tspan></text><text x="66" y="179" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="66" dy="0">Path, exact text and source coordinates</tspan><tspan x="66" dy="21">Stable identifiers in one ordered corpus</tspan></text><rect id="retrieval-query" x="847" y="126" width="385" height="102" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="847" y="126" width="6" height="102" rx="3" fill="#0284C7"/><text x="867" y="153" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="867" dy="0">User question / search text</tspan></text><text x="867" y="179" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="867" dy="0">Query embedding + lexical and code terms</tspan><tspan x="867" dy="21">Search query may differ from question</tspan></text><rect id="semantic" x="69" y="333" width="353" height="184" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="69" y="333" width="6" height="184" rx="3" fill="#4F46E5"/><text x="89" y="360" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="89" dy="0">Semantic ranking</tspan></text><text x="89" y="386" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="89" dy="0">EmbeddingSession → vectors</tspan><tspan x="89" dy="21">SemanticIndex + embed_query()</tspan><tspan x="89" dy="21">Vector similarity → ordered results</tspan></text><rect id="lexical" x="463" y="333" width="353" height="184" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="463" y="333" width="6" height="184" rx="3" fill="#4F46E5"/><text x="483" y="360" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="483" dy="0">Lexical ranking</tspan></text><text x="483" y="386" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="483" dy="0">Token / identifier / bigrams</tspan><tspan x="483" dy="21">Sparse TF-IDF LexicalIndex</tspan><tspan x="483" dy="21">Lexical matching → ordered results</tspan></text><rect id="code-channel" x="857" y="333" width="354" height="184" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="857" y="333" width="6" height="184" rx="3" fill="#4F46E5"/><text x="877" y="360" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="877" dy="0">Code-aware ranking</tspan></text><text x="877" y="386" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="877" dy="0">Definitions / references / imports</tspan><tspan x="877" dy="21">CodeGraph and entity matching</tspan><tspan x="877" dy="21">Related chunks → ordered results</tspan></text><rect id="rrf" x="269" y="636" width="378" height="117" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="269" y="636" width="6" height="117" rx="3" fill="#4F46E5"/><text x="289" y="663" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="289" dy="0">Reciprocal-rank fusion</tspan></text><text x="289" y="689" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="289" dy="0">Equal-weight ranked lists</tspan><tspan x="289" dy="21">Stable tie-breaking by chunk ID</tspan></text><rect id="retrieval-evidence" x="685" y="636" width="385" height="117" rx="13" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="1.6"/><rect x="685" y="636" width="6" height="117" rx="3" fill="#059669"/><text x="705" y="663" fill="#0F172A" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle"><tspan x="705" dy="0">Evidence and document context</tspan></text><text x="705" y="689" fill="#475569" font-size="15" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="705" dy="0">Named-source expansion, whole document</tspan><tspan x="705" dy="21">Exact path / line / cell / page</tspan></text><rect x="1088" y="630" width="159" height="118" rx="9" fill="#FFF2D9" stroke="#D97706" stroke-width="1.6"/><text x="1102" y="647" fill="#92400E" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle"><tspan x="1102" dy="0">Persisted index:</tspan><tspan x="1102" dy="20">chunks + vectors</tspan><tspan x="1102" dy="20">lexical + graph</tspan><tspan x="1102" dy="20">model snapshot</tspan><tspan x="1102" dy="20">payload checksum</tspan></text>


