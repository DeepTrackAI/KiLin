<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QAChat</title>
    <link rel="stylesheet" href="styles.css">
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="workspace">
      <header class="topbar">
        <span class="brand">QAChat</span>
        <span id="connection" class="top-status">Connecting…</span>
      </header>

      <section id="setup" class="setup">
        <p class="eyebrow">QAChat, your research assistant</p>
        <h1>Ask your project.</h1>
        <p class="intro">Runs locally. You control the models and settings; answers cite your files and flag missing evidence.</p>
        <form id="project-form" class="setup-card">
          <label for="kind">Project type</label>
          <select id="kind">
            <option value="code">Code repository</option>
            <option value="literature">Literature collection</option>
          </select>
          <label for="source">Source folder</label>
          <div class="folder-row">
            <input id="source" type="text" placeholder="Leave blank to try the example project">
            <button id="browse" type="button" class="secondary">Browse</button>
          </div>
          <p class="hint">Your original files stay unchanged. QAChat works from a local sandbox copy.</p>
          <button id="open" class="primary" type="submit">Open project</button>
        </form>
      </section>

      <section id="chat" class="chat hidden">
        <div class="chat-heading">
          <div>
            <p class="eyebrow">OPEN PROJECT</p>
            <h1 id="project-name">Project chat</h1>
            <p id="project-detail" class="hint"></p>
          </div>
          <div class="heading-actions">
            <button id="new-chat" type="button" class="secondary">New chat</button>
            <button id="change-project" type="button" class="secondary">Change project</button>
          </div>
        </div>
        <div id="conversation" class="conversation" aria-live="polite"></div>
        <form id="question-form" class="composer">
          <textarea id="question" rows="2" placeholder="Ask about this project…"></textarea>
          <button id="send" class="primary" type="submit">Ask</button>
        </form>
      </section>

      <div id="activity" class="activity hidden" role="status">
        <div class="activity-heading">
          <strong id="activity-percent">Starting…</strong>
          <button id="stop" type="button" class="secondary">Stop</button>
        </div>
        <div class="activity-track"><div id="activity-fill"></div></div>
        <div id="activity-text"></div>
        <div id="activity-detail" class="activity-detail"></div>
      </div>
      <p id="error" class="error hidden" role="alert"></p>
    </main>
  </body>
</html>
